[project]
name = "document-understanding"
version = "0.1.0"
description = "Utilizes OCR , AI Agents to extract structured output from genealogical records"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.108.0",
    "ipykernel>=7.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.2.6",
    "langchain-openai>=0.2.0",
    "langgraph>=1.2.0",
    "mlx-vlm>=0.6.3",
    "onnxruntime>=1.27.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.14.0",
    "streamlit>=1.40.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ragas>=0.2.0",
    "langchain-openai>=0.2.0",
    "datasets>=2.14.0",
    "streamlit>=1.40.0",
    "matplotlib>=3.11.0",
]


[tool.ruff]
target-version = "py311"


[tool.mypy]
python_version = "3.11"


[tool.pytest.ini_options]
pythonpath = ["."]
